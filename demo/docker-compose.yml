services:
  # Arize Phoenix - OpenInference observability platform
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"    # UI and HTTP OTLP endpoint
      - "4317:4317"    # gRPC OTLP endpoint
    environment:
      - PHOENIX_PORT=6006
      - PHOENIX_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6006"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability

  # Jaeger - Distributed tracing platform
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP
      - "4318:4318"    # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability

networks:
  observability:
    driver: bridge
